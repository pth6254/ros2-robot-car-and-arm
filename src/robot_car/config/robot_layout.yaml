# =====================================================================
#  로봇 배치 설정 파일 (이 파일이 로봇 모델의 '원본'입니다)
#
#  수정 후 적용:   python3 tools/build_robot.py
#    -> urdf/robot_car.urdf 자동 생성 + 검사 + PyBullet 주행 테스트
#    -> RViz(display.launch.py)가 켜져 있으면 바로 갱신
#
#  단위:  길이 mm  /  무게 g  /  각도 도(deg)
#  좌표:  원점 = 뒤쪽 두 구동바퀴 축의 정중앙 (바닥이 아니라 '축 높이')
#         x = 앞(+)/뒤(-)    y = 왼쪽(+)/오른쪽(-)    z = 위(+)/아래(-)
#         바닥 높이 = -(바퀴 반지름)
#
#  ※ urdf/robot_car.urdf 는 자동 생성 파일입니다. 직접 고치지 말고 이 파일을 고치세요.
# =====================================================================

drive:                       # 구동부: 바퀴 + TT 모터
  wheel_radius: 30           # 바퀴 반지름 (실측: 바퀴 꼭대기 60mm -> 지름 60mm)
  wheel_width: 30            # 타이어 폭 (실측 3cm)
  # ★ 좌우 바퀴 '폭 중앙' 사이 거리 (회전 정확도에 직결)
  #   실측 구조: 바퀴 3cm | 판 22cm | 바퀴 3cm  ->  220 + 30/2 + 30/2 = 250
  wheel_separation: 250
  wheel_mass: 50             # 바퀴 1개
  max_rpm: 190               # 바퀴 최고 회전수 (TT모터 6V 약 200rpm)
  motor:
    size: [65, 19, 22]       # [앞뒤 길이, 좌우 폭, 높이] 노란 기어박스
    center_x: 22             # 모터 몸통 중심 x (축은 x=0, 몸통은 앞으로 뻗음)
    center_z: 0              # 모터 몸통 중심 높이
    gap_to_wheel: 3          # 모터 바깥면 ~ 바퀴 안쪽면 틈
    mass: 30                 # 모터 1개

plate:                       # 몸체 판 (모든 부품이 붙는 판)
  length: 220                # 앞뒤 길이 (실측 22cm)
  width: 220                 # 좌우 폭 (실측 22cm), 바퀴는 판 양옆에 붙어 있음
  thickness: 3
  rear_x: -40                # 판 뒤쪽 끝의 x 위치  ※실측 필요
  bottom_z: 12               # 판 아랫면 높이 (축 기준). 가정: 모터 위에 바로 얹힘 = 바닥에서 42mm  ※실측 필요
  mass: 140                  # 판 + 배선 + 나사 등

caster:                      # 보조 바퀴 (시뮬레이션에서는 마찰 없는 공으로 처리)
  x: 150                     # 판 앞끝(180)에서 30mm 안쪽  ※실측 필요
  y: 0
  ball_radius: 15
  mass: 10

# ---------------------------------------------------------------------
# 판에 붙는 부품들
#   type   : arduino_uno | esp32_devkit_v1 | l298n | battery_18650x2 | mpu6050_gy521 | ir_obstacle
#            | breadboard_mini | breadboard_half | breadboard_full
#            | box | cylinder   (box/cylinder 는 size, color 직접 지정)
#   mount  : top    = 판 윗면에 올림
#            bottom = 판 아랫면에 매달림
#            free   = z 로 '부품 바닥 높이'를 직접 지정
#   x, y   : 위에서 봤을 때 부품 '중심' 위치
#   yaw    : 위에서 봤을 때 반시계 회전 각도 (0 = 부품 앞쪽이 로봇 앞쪽)
#   z_offset: (선택) top 이면 판에서 띄운 높이, bottom 이면 판 아래로 띄운 거리
#   mass, size, color : (선택) 템플릿 기본값 덮어쓰기
#   센서(ir_obstacle, tof_vl53l0x)는 x축이 측정 방향이고, 링크 원점이 센서 앞면에 자동 배치됨
# ---------------------------------------------------------------------
parts:
  # =========================== 1층 앞쪽: ESP32 ===========================
  #  (앞)  [ 미니 브레드보드 ] <- ESP32 앞쪽 핀 줄 (미니 맨 뒷줄). 앞쪽 절반은 센서 배선 여유
  #            ~5mm 틈
  #        [ 풀사이즈 브레드보드 ] <- ESP32 뒤쪽 핀 줄 (풀사이즈 맨 앞 터미널 줄)
  #  ESP32 핀 줄 간격 22.86mm 에 맞춰 두 브레드보드 위치를 계산함
  #  (초음파 센서는 강사 지시로 제외)

  - name: breadboard_front   # 판 맨 앞, 좌우 정중앙. 17열이 좌우(y) 방향
    type: breadboard_mini
    mount: top
    x: 155.5                 # 앞끝 173 ~ 뒤끝 138
    y: 0
    yaw: 90

  - name: esp32              # 미니(앞 핀 줄)와 풀사이즈(뒤 핀 줄) 사이를 걸침
    type: esp32_devkit_v1    # 안테나(+x 끝) -> 왼쪽(+y), micro USB -> 오른쪽(-y)
    mount: top
    x: 130.45                # 핀 줄 x = 141.9 (미니 맨 뒷줄), 119.0 (풀사이즈 맨 앞 줄)
    y: 0
    yaw: 90
    z_offset: 8.5            # 브레드보드 윗면
    standoff: 2.5            # 핀헤더 플라스틱 두께

  - name: breadboard_full    # 보유 풀사이즈. 63열이 좌우(y) 방향, 판 폭을 거의 다 씀
    type: breadboard_full
    mount: top
    x: 105                   # 앞끝 132.5 ~ 뒤끝 77.5
    y: 0
    yaw: 90

  # MPU-6050 (GY-521) 자이로/가속도 센서: 풀사이즈 브레드보드 빈 곳(ESP32 바로 뒤, 좌우 중앙)에 꽂음
  #   칩 X축이 로봇 앞(+x)을 향하게 -> 센서 값 방향 = 로봇 방향.  링크 이름 imu_link = /imu 토픽의 frame_id
  #   배선(예정): VCC -> 3V3, GND, SDA -> D21, SCL -> D17, INT -> D4
  - name: imu_link
    type: mpu6050_gy521
    mount: top
    x: 95
    y: 0
    yaw: 0
    z_offset: 8.5            # 브레드보드 윗면
    standoff: 2.5            # 핀헤더 플라스틱 두께

  # =========================== 1층 뒤쪽: 배터리 (2층 아래) ===========================
  #  가장 무거운 부품(110g)을 낮게 -> 무게중심을 낮춰 급출발 시 앞 들림 감소
  - name: battery            # 셀이 좌우 방향으로 눕혀짐. 윗면 z=36, 2층 판 아랫면 z=55 -> 19mm 여유
    type: battery_18650x2
    mount: top
    x: 0
    y: 0
    yaw: 0

  # (Uno 로 조립할 경우 위 esp32 를 주석 처리하고 아래를 사용)
  # - name: arduino
  #   type: arduino_uno
  #   mount: top
  #   x: 60
  #   y: 0
  #   yaw: 0

  # =========================== 2층: 판 뒤쪽 8cm, 1층과 간격 4cm ===========================
  #  1층 판 윗면(z=15) 위 40mm 지지대 4개 -> 2층 판 아랫면 z=55
  #  (간격 8cm 대비 무게중심 6.4mm 낮아지고 급출발 들림 5.0° -> 3.4°)
  - name: standoff_rl        # 지지대 (M3 스페이서 40mm 가정), 뒤-왼
    type: cylinder
    size: [6, 40]
    color: silver
    mass: 5
    mount: top
    x: -35
    y: 105
  - name: standoff_rr        # 뒤-오른
    type: cylinder
    size: [6, 40]
    color: silver
    mass: 5
    mount: top
    x: -35
    y: -105
  - name: standoff_fl        # 앞-왼
    type: cylinder
    size: [6, 40]
    color: silver
    mass: 5
    mount: top
    x: 35
    y: 105
  - name: standoff_fr        # 앞-오른
    type: cylinder
    size: [6, 40]
    color: silver
    mass: 5
    mount: top
    x: 35
    y: -105

  - name: deck               # 2층 판: 앞뒤 80mm (1층 판 뒤끝 -40 ~ 40) x 좌우 220mm, 3mm
    type: box
    size: [80, 220, 3]
    color: white
    mass: 60
    mount: free
    z: 55                    # 1층 판 윗면 15 + 지지대 40
    x: 0
    y: 0

  - name: l298n              # 2층 위 (가벼운 부품을 위로). 방열판은 앞(+x), 위가 트여 방열 좋음
    type: l298n              # 모터 선은 2층 판 구멍 -> 1층 판 구멍 -> 판 아래 모터
    mount: free
    z: 58                    # 2층 판 윗면
    x: 0
    y: 0
    yaw: 0

  # =========================== 1층 판 아래: 앞쪽 IR 장애물 센서 ===========================
  #  FC-51 류 3핀(VCC, GND, OUT) 모듈, LED 가 앞을 향함. VCC 는 ESP32 3V3
  #  OUT: 왼쪽 -> ESP32 D22, 오른쪽 -> D23.  장애물 감지 시 ESP32 가 전진을 차단
  #  링크 이름(ir_left / ir_right) = ROS 토픽 /ir/left, /ir/right 의 frame_id
  - name: ir_left            # 판 앞 끝 바로 아래, LED 앞면이 판 끝보다 2mm 앞
    type: ir_obstacle
    mount: bottom
    x: 164
    y: 35
    yaw: 0

  - name: ir_right
    type: ir_obstacle
    mount: bottom
    x: 164
    y: -35
    yaw: 0

# 예) 브레드보드 추가하고 싶으면 아래 주석을 풀고 위치만 정하면 됩니다
