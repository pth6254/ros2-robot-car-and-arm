# 로봇팔 관절 보정값 (슬라이더 0.000 = 모든 관절 똑바로 선 자세)
#
# 관절 순서: [base_shoulder, shoulder_arm1, arm1_arm2, arn2_end_arm]
#             (Arduino D3,    D4,            D5,        D6)
#
# 서보 각도 = 90 + direction * (관절 각도[deg]) + offset
#
# joint_offsets_deg : 똑바로 선 자세일 때 실제 서보 각도 - 90
#                     예) 서보 0도에서 똑바로 서면 -90
#                         슬라이더 x[rad]에서 실물이 똑바로 서면  degrees(x)
# joint_directions  : 실물이 RViz와 반대로 돌면 -1
#
# 서보는 0~180도만 움직이므로, offset이 0이 아닌 관절은 한쪽 방향 범위가 줄어든다.
# (범위 밖 명령은 0/180도에서 멈추고, 진한 트윈 모델도 그 위치에 멈춰 보인다)
ros_arm_bridge:
  ros__parameters:
    joint_directions:  [-1, -1, -1, -1]
    joint_offsets_deg: [0.0, -82.7, -61.8, 0.0]
